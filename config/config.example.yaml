ccee:
  dataset: "pld_horario"
  url_busca: "https://dadosabertos.ccee.org.br/api/3/action/datastore_search"
  url_pacote: "https://dadosabertos.ccee.org.br/api/3/action/package_show"
  anos: [2025, 2026]
  limite_por_pagina: 5000
  timeout: 60
  tentativas: 3
  espera_segundos: 2
  # Preencha so se aparecer "Recurso nao encontrado". Exemplo: 2025: "id-do-recurso"
  resource_ids: {}

# Valores oficiais homologados pela ANEEL (em R$/MWh)
# Dataset "pld_horario" utiliza o teto horario (PLDmax_horario)
limites_pld:
  2025: { piso: null, teto: null }
  2026: { piso: null, teto: null }

open_meteo:
  url: "https://archive-api.open-meteo.com/v1/archive"
  data_inicio: "2025-01-01"
  data_fim: "2025-12-31"
  fuso: "America/Sao_Paulo"
  timeout: 60
  tentativas: 3
  espera_segundos: 2
  pausa_entre_usinas: 2

origem:
  schema: "campo_real_energia"